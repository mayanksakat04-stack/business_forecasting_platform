services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dashboard_db
    ports:
      - "5433:5432" # Mapped to 5433 on host so it doesn't clash with your local Ubuntu Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Connects to the 'db' service name over Docker's internal network
      DATABASE_URL: postgresql://postgres:password123@db:5432/dashboard_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: